apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd

spec:
  project: default

  source:
    repoURL: {{ .Values.application.repo }}
    chart: {{ .Values.application.chart }}
    targetRevision: {{ .Values.application.version }}

  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true