apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: prometheus
  namespace: monitoring

spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}

  hostnames:
    - {{ .Values.prometheus.hostname }}

  rules:
    - backendRefs:
        - name:  prometheus-operated 
          port: 9090