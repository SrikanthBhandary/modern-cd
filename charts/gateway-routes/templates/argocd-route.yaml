apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: argocd
  namespace: argocd

spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - {{ .Values.argocd.hostname }}
  rules:
    - backendRefs:
        - name: {{ .Values.argocd.service }}
          port: 80