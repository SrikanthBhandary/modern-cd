apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: progressive
  namespace: podinfo

spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}

  hostnames:
    - {{ .Values.progressive.hostname }}

  rules:    
    - backendRefs:
        - name: podinfo-stable
          port: 9898
          weight: 100

        - name: podinfo-canary
          port: 9898
          weight: 0

  